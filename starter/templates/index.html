<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="theme-toggle-container">
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
  
  <h1>Sudoku Game</h1>
  
  <div class="difficulty-selector">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  
  <div class="timer-display">
    <span id="timer">00:00</span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
    <button id="view-scores">View Scores</button>
    <span id="message"></span>
  </div>

  <!-- Congratulations Modal -->
  <div id="congratulations-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>🎉 Congratulations! 🎉</h2>
      <p id="congrats-message">You solved the puzzle in <span id="final-time">00:00</span></p>
      <div class="form-group">
        <label for="player-name">Enter your name:</label>
        <input type="text" id="player-name" placeholder="Your name" maxlength="30" />
      </div>
      <button id="save-score-btn">Save Score</button>
      <button id="skip-score-btn">Skip</button>
    </div>
  </div>

  <!-- Scoreboard Modal -->
  <div id="scoreboard-modal" class="modal" style="display: none;">
    <div class="modal-content scoreboard-content">
      <h2>🏆 Top 10 Scores 🏆</h2>
      <div id="scores-container">
        <table class="scores-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Time</th>
              <th>Level</th>
              <th>Hints</th>
            </tr>
          </thead>
          <tbody id="scores-tbody">
            <!-- Scores will be inserted here -->
          </tbody>
        </table>
      </div>
      <button id="close-scoreboard-btn">Close</button>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
